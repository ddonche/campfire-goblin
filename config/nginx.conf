# nginx in front of goblin-host. goblin-host maps /api/<name> to
# app/api/<name>.gbln and has no routing of its own, so nginx serves
# public/ directly and sends every other request to the front controller,
# app/api/app.gbln, with the original URI in X-Request-URI.
#
# bin/server fills in @ROOT@, @PORT@ and @GOBLIN_PORT@.

worker_processes auto;
pid @ROOT@/tmp/nginx.pid;
error_log @ROOT@/tmp/log/nginx-error.log warn;
daemon off;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;

  client_body_temp_path @ROOT@/tmp/nginx/body;
  proxy_temp_path @ROOT@/tmp/nginx/proxy;
  fastcgi_temp_path @ROOT@/tmp/nginx/fastcgi;
  uwsgi_temp_path @ROOT@/tmp/nginx/uwsgi;
  scgi_temp_path @ROOT@/tmp/nginx/scgi;
  client_max_body_size 100m;

  upstream goblin {
    server 127.0.0.1:@GOBLIN_PORT@;
    # No upstream keepalive: goblin-host cannot send an empty body (a
    # bodiless status such as 204 or 304 still carries one byte), and that
    # stray byte would corrupt the next response on a reused connection.
  }

  server {
    listen @PORT@;
    root @ROOT@/public;

    # Fingerprinted assets, as Propshaft serves them.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # send_file: the app answers with X-Accel-Redirect to one of these and
    # nginx streams the file, keeping the app's headers. (Goblin responses
    # are text, so files never pass through the app.)
    location /_send/assets/ {
      internal;
      alias @ROOT@/public/assets/;
    }

    location /_send/storage/ {
      internal;
      alias @ROOT@/storage/;
    }

    location / {
      try_files $uri @app;
    }

    location @app {
      rewrite ^ /api/app break;
      proxy_pass http://goblin;
      proxy_http_version 1.1;
      proxy_set_header Connection "close";
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-URI $request_uri;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # /cable long polls wait up to 20 seconds for broadcasts.
      proxy_read_timeout 60s;
    }
  }
}
